  fila.then(pagina).then(function(r){return pg.then(function(){escrever(r.html)})},function(e){
    if(String(e&&e.message)==='sessao'){tela('Entre com sua conta para continuar.',true);return}
    tela('Não consegui abrir agora: '+(e&&e.message||'erro')+'. Tente de novo.',true)});
}

/* ---------- contas com e-mail e senha ---------- */
var modoForm='entrar';
function abrirForm(m){
  modoForm=m||'entrar';$('spin').style.display='none';$('entrar').style.display='none';$('comemail').style.display='none';$('dica').style.display='none';
  $('form').style.display='block';
  $('l-nome').style.display=modoForm==='criar'?'block':'none';
  $('l-senha').style.display=modoForm==='esqueci'?'none':'block';
  $('f-senha').setAttribute('autocomplete',modoForm==='criar'?'new-password':'current-password');
  $('f-ok').textContent=modoForm==='criar'?'Criar conta':modoForm==='esqueci'?'Enviar link para trocar a senha':'Entrar';
  $('f-troca').textContent=modoForm==='entrar'?'Criar conta':'Já tenho conta';
  $('f-esqueci').style.display=modoForm==='entrar'?'inline':'none';
  msg(modoForm==='criar'?'Crie sua conta do Profy.':modoForm==='esqueci'?'Informe o e-mail da sua conta.':'Entre com seu e-mail e senha.');
}
$('comemail').onclick=function(){abrirForm('entrar')};
$('f-troca').onclick=function(){abrirForm(modoForm==='entrar'?'criar':'entrar')};
$('f-esqueci').onclick=function(){abrirForm('esqueci')};
$('f-voltar').onclick=function(){tela('Entre com sua conta para começar.',true)};
var ERROS={EMAIL_EXISTS:'Já existe uma conta com esse e-mail. Toque em "Já tenho conta".',EMAIL_NOT_FOUND:'Não achei conta com esse e-mail.',INVALID_PASSWORD:'Senha incorreta.',INVALID_LOGIN_CREDENTIALS:'E-mail ou senha incorretos.',INVALID_EMAIL:'Esse e-mail não parece válido.',MISSING_PASSWORD:'Digite a senha.',WEAK_PASSWORD:'A senha precisa ter pelo menos 6 caracteres.',TOO_MANY_ATTEMPTS_TRY_LATER:'Muitas tentativas. Espere alguns minutos e tente de novo.',USER_DISABLED:'Essa conta foi desativada.'};
function erroFB(j){var c=(j&&j.error&&j.error.message)||'';c=c.split(' ')[0].split(':')[0];return ERROS[c]||'Não deu certo ('+(c||'sem conexão')+'). Tente de novo.'}
function idt(rota,corpo){return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+rota+'?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
$('form').onsubmit=function(ev){
  ev.preventDefault();
  var email=$('f-email').value.trim().toLowerCase(),senha=$('f-senha').value,nome=$('f-nome').value.trim();
  if(!email){msg('Digite seu e-mail.',true);return}
  if(modoForm==='criar'&&!nome){msg('Digite seu nome.',true);return}
  $('f-ok').disabled=true;msg('Um instante…');
  var fim=function(){$('f-ok').disabled=false};
  if(modoForm==='esqueci'){
    idt('sendOobCode',{requestType:'PASSWORD_RESET',email:email}).then(function(){fim();abrirForm('entrar');msg('Pronto! Veja seu e-mail (e a caixa de spam) para criar uma senha nova.')},function(j){fim();msg(erroFB(j),true)});
    return;
  }
  var p=modoForm==='criar'
    ?idt('signUp',{email:email,password:senha,returnSecureToken:true}).then(function(j){return idt('update',{idToken:j.idToken,displayName:nome,returnSecureToken:false}).then(function(){j.displayName=nome;return j},function(){j.displayName=nome;return j})})
    :idt('signInWithPassword',{email:email,password:senha,returnSecureToken:true});
  p.then(function(j){
    var nm=(j.displayName||'').trim(),partes=nm.split(/\s+/);
    gravar('profy-fb',{id:j.idToken,rt:j.refreshToken,exp:Date.now()+(+j.expiresIn||3600)*1000,uid:j.localId,email:j.email||email,nome:nm});
    gravar('profy-modo','email');
    gravar('profy-g',{given_name:partes[0]||'',family_name:partes.slice(1).join(' '),picture:'',email:j.email||email});
    fim();iniciarEmail();
  },function(j){fim();msg(erroFB(j),true)});
};

function htmlEmail(){
  return fetch('app-branco.html?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('app '+r.status);return r.text()}).then(function(h){try{localStorage.setItem('profy-html-email',h)}catch(e){}return h});
}
function iniciarEmail(){
  msg('Carregando seus dados…');$('form').style.display='none';$('spin').style.display='block';
  PROFY_PONTE_FB();
  var cache=localStorage.getItem('profy-html-email');
  var pend=ler('profy-pend-fb',{});
  var fila=Object.keys(pend).length?PROFY_CHAMAR('salvarVarios',[pend]).catch(function(){}):Promise.resolve();
  if(cache){fila.then(function(){htmlEmail().catch(function(){});escrever(cache,PROFY_PONTE_FB)});return}
  fila.then(htmlEmail).then(function(h){escrever(h,PROFY_PONTE_FB)},function(e){tela('Não consegui abrir agora: '+(e&&e.message||'erro')+'. Tente de novo.',true)});
}

(function(){
  var h=new URLSearchParams(location.hash.replace(/^#/,''));
  var s=new URLSearchParams(location.search);
  var erro=h.get('error');
  if(h.get('access_token')){
    try{localStorage.setItem('profy-tok',JSON.stringify({t:h.get('access_token'),sc:SC,exp:Date.now()+(+h.get('expires_in')||3600)*1000}));localStorage.removeItem('profy-modo');
      if(ler('profy-uid','g')!=='g'){Object.keys(localStorage).forEach(function(k){if(/^(cad-|_)/.test(k))localStorage.removeItem(k)});gravar('profy-uid','g')}}catch(e){}
  }
  if(location.hash||location.search)history.replaceState(null,'',RED);
  if(s.get('sair')){try{['profy-fb','profy-modo','profy-tok'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}tela('Você saiu. Entre com sua conta para continuar.',true);return}
  if(ler('profy-modo','')==='email'){
    if(ler('profy-fb',null)){if(!navigator.onLine){var c0=localStorage.getItem('profy-html-email');if(c0){PROFY_PONTE_FB();return escrever(c0,PROFY_PONTE_FB)}}return iniciarEmail()}
    tela('',true);abrirForm('entrar');return;
  }
  if(s.get('email')){tela('',true);abrirForm('entrar');return}
  if(tok())return iniciar();
  if(!navigator.onLine){var e=ler('profy-email','');var c=e&&localStorage.getItem('profy-html:'+e);if(c){PROFY_PONTE();return escrever(c)}}
  if(erro){tela('Entre com sua conta para continuar.',true);return}
  if(ler('profy-email','')||s.get('entrar'))return auth(true);
  tela('Bem-vindo! Entre com sua conta para começar.',true);
})();
</script>
